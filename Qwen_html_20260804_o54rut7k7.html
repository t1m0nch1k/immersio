<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Погружение — учи язык постепенно</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f5f1e6; --card:#fffdf6; --ink:#1b2a23; --ink2:#5f7268;
  --pine:#0f3d2e; --pine2:#0b2d22; --pine3:#1c5b44;
  --sun:#ffd43b; --sun2:#ffb81c; --coral:#ff5a47; --sea:#0e8a6d; --sky:#7cc7e8;
  --line:rgba(27,42,35,.14);
}
html{scroll-behavior:smooth}
body{font-family:'Golos Text',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(27,42,35,.09) 1.2px,transparent 1.2px);background-size:24px 24px}
::selection{background:var(--sun);color:var(--ink)}
button{font-family:inherit;color:inherit}

/* ---------- фоновые буквы ---------- */
#bgletters{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#bgletters span{position:absolute;font-family:'Unbounded';font-weight:800;color:rgba(15,61,46,.06);animation:drift ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-48px) rotate(7deg)}}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:var(--pine);color:#f3efe2;border-bottom:3px solid var(--ink)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Unbounded';font-weight:800;font-size:14px;letter-spacing:.08em;cursor:pointer;user-select:none}
.mark{width:36px;height:36px;border-radius:11px;background:var(--sun);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex-shrink:0;transition:transform .2s}
.logo:hover .mark{transform:rotate(-8deg)}
.hspace{flex:1}
.hchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1.5px solid rgba(243,239,226,.28);
  background:rgba(255,255,255,.08);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s;position:relative}
.hchip:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.hchip b{font-family:'JetBrains Mono';font-size:14px}
.hchip.lit .fl{display:inline-block;animation:flick 1.1s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.25) rotate(4deg)}}
.hchip.pop{animation:chippop .5s}
@keyframes chippop{40%{transform:scale(1.18)}}
#avbtn{width:40px;height:40px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:.15s}
#avbtn:hover{transform:translateY(-2px) rotate(-6deg)}
.hmenu{position:absolute;top:calc(100% + 10px);right:0;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 rgba(27,42,35,.25);padding:6px;min-width:210px;z-index:80;animation:pop-in .2s}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.mi:hover{background:rgba(15,61,46,.08)}
.mi.cur{background:var(--sun)}
.mi small{margin-left:auto;color:var(--ink2);font-weight:600}

/* ---------- каркас ---------- */
.shell{display:flex;gap:26px;max-width:1220px;margin:26px auto;padding:0 20px;position:relative;z-index:1}
aside{width:240px;flex-shrink:0;position:sticky;top:86px;align-self:flex-start;display:flex;flex-direction:column;gap:16px}
main{flex:1;min-width:0;padding-bottom:40px}
.view{max-width:860px}

.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:20px;box-shadow:0 8px 0 rgba(27,42,35,.10);animation:pop-in .45s both;animation-delay:var(--d,0s)}
@keyframes pop-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.overline{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--pine3);font-family:'JetBrains Mono'}
h1.display{font-family:'Unbounded';font-weight:800;font-size:clamp(24px,3.6vw,36px);line-height:1.18;margin:6px 0 4px}
.sub{color:var(--ink2);font-size:15px;line-height:1.55;max-width:60ch}

/* ---------- навигация ---------- */
nav.side{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px;box-shadow:0 6px 0 rgba(27,42,35,.12)}
.nitem{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:0;background:none;border-radius:11px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.18s;text-align:left}
.nitem svg{width:20px;height:20px;flex-shrink:0}
.nitem:hover{background:rgba(15,61,46,.07);transform:translateX(4px)}
.nitem.active{background:var(--pine);color:#f3efe2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.nitem .cnt{margin-left:auto;background:var(--sun);border:1.5px solid var(--ink);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:800;color:var(--ink)}
.nitem.active .cnt{color:var(--ink)}

/* ---------- глубина ---------- */
.depth{background:var(--pine);color:#eef3ea;border:2px solid var(--ink);border-radius:16px;padding:16px;box-shadow:0 6px 0 rgba(27,42,35,.12)}
.depth .val{font-family:'Unbounded';font-weight:800;font-size:36px;color:var(--sun);line-height:1;margin:8px 0 2px}
.depth .val small{font-size:16px;color:#eef3ea;opacity:.7}
.depth .cap{font-size:12px;opacity:.75;margin-bottom:10px}
.track{position:relative;height:18px;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--pine2));border:2px solid var(--ink);margin:16px 0 6px}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),var(--sun2));transition:width .6s cubic-bezier(.5,1.5,.5,1)}
.diver{position:absolute;top:-16px;transform:translateX(-50%);font-size:20px;transition:left .6s cubic-bezier(.5,1.5,.5,1);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.depth input[type=range]{width:100%;accent-color:var(--sun);cursor:pointer;margin-top:6px}
.depth .note{font-size:11.5px;opacity:.65;margin-top:8px;line-height:1.4}

.wdots{display:flex;gap:6px;justify-content:space-between;margin-top:10px}
.wd{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-size:10px;font-weight:800;background:#fff;font-family:'JetBrains Mono'}
.wd.on{background:var(--coral);color:#fff}
.sidecard{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 6px 0 rgba(27,42,35,.12)}
.sidecard h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:'JetBrains Mono';color:var(--pine3)}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:12px 20px;
  font-weight:800;font-size:14.5px;cursor:pointer;transition:.15s;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.sun{background:var(--sun)}
.btn.pine{background:var(--pine);color:#f6f2e4}
.btn.coral{background:var(--coral);color:#fff}
.btn.small{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.big{padding:15px 28px;font-size:16px;border-radius:14px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{text-decoration:underline;transform:none;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:0 4px 0 var(--ink)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;font-size:15px;display:inline-grid;place-items:center;transition:.15s;box-shadow:0 2px 0 var(--ink)}
.iconbtn:hover{transform:translateY(-2px) scale(1.06);background:var(--sun)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1.5px solid var(--ink);border-radius:99px;font-size:12.5px;font-weight:800;background:#fff}
.chip.sun{background:var(--sun)} .chip.sea{background:#d9f2e4;border-color:var(--sea);color:#0b5c49}
.chip.coral{background:#ffe1dc;border-color:var(--coral);color:#a3271a}
.chip.dim{border-style:dashed;color:var(--ink2)}

/* ---------- уроки ---------- */
.hero{background:var(--pine);color:#f3efe2;border:2px solid var(--ink);border-radius:20px;padding:24px;box-shadow:0 8px 0 rgba(27,42,35,.18);position:relative;overflow:hidden}
.hero::after{content:'~ ~ ~';position:absolute;right:-14px;bottom:-22px;font-family:'Unbounded';font-size:90px;color:rgba(255,255,255,.06);letter-spacing:.1em;pointer-events:none}
.hero .tag{display:inline-block;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:800;font-size:12.5px;transform:rotate(-1.5deg);box-shadow:0 3px 0 var(--ink)}
.hero h2{font-family:'Unbounded';font-size:clamp(20px,2.8vw,28px);margin:12px 0 10px;font-weight:800}
.hero .preview{background:rgba(255,255,255,.08);border:1.5px dashed rgba(243,239,226,.4);border-radius:12px;padding:12px 16px;font-size:15.5px;line-height:1.9;margin-bottom:16px}
.hero .preview .tk{cursor:default}
.herostat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.herostat div b{font-family:'Unbounded';font-size:20px;color:var(--sun)}
.herostat div span{display:block;font-size:12px;opacity:.75}

.lrow{display:flex;align-items:center;gap:16px;padding:16px 18px;margin-top:14px;transition:.18s;cursor:pointer}
.lrow:hover{transform:translateY(-3px);box-shadow:0 12px 0 rgba(27,42,35,.14)}
.lnum{font-family:'Unbounded';font-weight:800;font-size:17px;width:48px;height:48px;border-radius:13px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--sun);flex-shrink:0;box-shadow:0 3px 0 var(--ink)}
.lrow.done .lnum{background:var(--sea);color:#fff}
.lrow.locked{opacity:.55;filter:saturate(.5);cursor:not-allowed}
.lrow.locked:hover{transform:none;box-shadow:0 8px 0 rgba(27,42,35,.10)}
.lbody{flex:1;min-width:0}
.lbody h3{font-size:16.5px;font-weight:800}
.lmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.lstatus{margin-left:auto;text-align:right;flex-shrink:0;font-size:13px;font-weight:800}
.lstatus .ok{color:var(--sea)} .lstatus .lk{font-size:22px}

/* ---------- читалка ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;color:var(--pine3);cursor:pointer;margin-bottom:12px;background:none;border:0}
.backlink:hover{text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 18px;font-size:13px;align-items:center}
.legend .sw{display:inline-block;width:26px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.sw.new{background:var(--sun);border-bottom:2px dashed var(--ink)}
.sw.known{border-bottom:3px solid var(--sea)}
.text{font-size:19px;line-height:2.1;letter-spacing:.01em}
.tk{border:0;font:inherit;cursor:pointer;padding:1px 8px;border-radius:7px;font-weight:700;transition:.15s;white-space:nowrap}
.tk.new{background:linear-gradient(104deg,transparent 4%,var(--sun) 4% 96%,transparent 96%);border-bottom:2px dashed var(--ink);transform:rotate(-.6deg)}
.tk.new:hover{transform:rotate(0) translateY(-2px);box-shadow:0 3px 0 rgba(27,42,35,.35)}
.tk.known{color:var(--pine);border-bottom:2.5px solid var(--sea);background:transparent}
.tk.known:hover{background:rgba(14,138,109,.1)}
.tk.just{animation:learnpop .55s}
@keyframes learnpop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(2deg)}100%{transform:scale(1)}}
.nat{color:inherit}
.readbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* ---------- задания ---------- */
.tsec{margin-top:16px;padding:20px}
.tsec h3{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:14px}
.tnum{width:30px;height:30px;border-radius:9px;background:var(--pine);color:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-family:'Unbounded';font-size:14px;flex-shrink:0}
.qword{font-family:'Unbounded';font-weight:700;font-size:19px;background:var(--sun);padding:6px 16px;border:2px solid var(--ink);border-radius:10px;display:inline-block;box-shadow:0 3px 0 var(--ink);margin-bottom:12px}
.mrow{padding:14px;border:2px dashed var(--line);border-radius:14px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14.5px;cursor:pointer;text-align:left;transition:.15s;box-shadow:0 3px 0 var(--ink)}
.opt:hover:not(:disabled){transform:translateY(-2px);background:#fffbe8}
.opt.ok{background:#d9f2e4;border-color:var(--sea);box-shadow:0 3px 0 var(--sea)}
.opt.bad{background:#ffe1dc;border-color:var(--coral);box-shadow:0 3px 0 var(--coral);animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.pb{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:10px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s;box-shadow:0 3px 0 var(--ink)}
.pb.sel{background:var(--sun);transform:translateY(-2px)}
.pb.done{background:#d9f2e4;border-color:var(--sea);box-shadow:0 3px 0 var(--sea);pointer-events:none;opacity:.8}
.pb.bad{animation:shake .4s;background:#ffe1dc;border-color:var(--coral)}
.fillin{font-size:17px;line-height:1.8;margin-bottom:10px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--sun2);text-align:center;font-weight:800;color:var(--sun2);letter-spacing:.2em}
.tprog{font-family:'JetBrains Mono';font-size:13px;font-weight:700;color:var(--pine3);margin-top:10px}
.finishzone{margin-top:22px;text-align:center}
.result{margin-top:20px;text-align:center;padding:28px 20px}
.result .ring{width:120px;height:120px;margin:0 auto 12px;position:relative}
.result .ring svg{transform:rotate(-90deg)}
.result .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Unbounded';font-size:24px}
.ring .fg{transition:stroke-dashoffset 1s ease}
.resstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}

/* ---------- словарь ---------- */
.dictbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px}
.search input{border:0;outline:0;background:none;font:inherit;font-size:15px;width:100%}
.catchip{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.catchip:hover{transform:translateY(-2px)}
.catchip.on{background:var(--pine);color:#f3efe2}
.wrow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:2px dashed var(--line);animation:pop-in .3s both;animation-delay:var(--d,0s)}
.wrow:hover{background:#fffbe8}
.wrow .fw{font-family:'Unbounded';font-weight:700;font-size:15px;min-width:140px}
.wrow .ru{color:var(--ink2);flex:1;font-size:14.5px}
.emptybox{text-align:center;padding:50px 20px;color:var(--ink2)}
.emptybox .big{font-size:52px;display:block;margin-bottom:12px}

/* ---------- профиль ---------- */
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-size:48px;flex-shrink:0}
.pname{display:flex;align-items:center;gap:10px;margin-top:8px}
.pname input{font:inherit;font-weight:800;font-size:18px;border:0;border-bottom:2px dashed var(--ink2);background:none;outline:0;width:220px;padding:2px}
.pname input:focus{border-bottom-color:var(--pine3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{padding:16px}
.stat b{font-family:'Unbounded';font-size:28px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:600}
.stat.fire b{color:var(--coral)}
.stat.sea b{color:var(--sea)}
.rankbar{height:14px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:8px}
.rankbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun2));transition:width .8s}
.hgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:10px}
.hg{aspect-ratio:1;border-radius:7px;border:2px solid var(--ink);background:#fff}
.hg.on{background:var(--coral)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.ach{padding:16px 12px;border-radius:15px;border:2px solid var(--ink);background:#fff;text-align:center;position:relative;transition:.2s}
.ach .ico{font-size:30px;display:block;margin-bottom:6px}
.ach b{font-size:13.5px;display:block}
.ach span{font-size:11.5px;color:var(--ink2);display:block;margin-top:3px;line-height:1.35}
.ach.lock{filter:grayscale(1);opacity:.45}
.ach:not(.lock):hover{transform:translateY(-4px) rotate(-1.5deg);box-shadow:0 8px 0 rgba(27,42,35,.15)}
.setrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.av{width:48px;height:48px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:26px;cursor:pointer;transition:.15s}
.av:hover{transform:translateY(-3px) rotate(-5deg);background:var(--sun)}
.av.cur{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.danger{color:#a3271a;border-color:var(--coral)}

/* ---------- попап слова ---------- */
.wcard{position:fixed;z-index:130;width:272px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:16px;box-shadow:0 10px 0 rgba(27,42,35,.25);animation:pop-in .22s}
.pflag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pine3);font-family:'JetBrains Mono'}
.pfw{font-family:'Unbounded';font-weight:800;font-size:23px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
.pru{font-size:16px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.pbtns{display:flex;gap:8px;margin-top:12px}
.pbtns .btn{flex:1}

/* ---------- тосты / конфетти ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:13px;font-weight:700;z-index:250;box-shadow:0 6px 0 rgba(0,0,0,.3);animation:toastin .3s;max-width:92vw;text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}}
.cf{position:fixed;top:-20px;z-index:300;pointer-events:none;border-radius:2px}

/* ---------- онбординг ---------- */
.ovl{position:fixed;inset:0;background:rgba(11,45,34,.93);z-index:150;display:grid;place-items:center;padding:20px;overflow:auto}
.dlg{background:var(--paper);border:3px solid var(--ink);border-radius:22px;max-width:640px;width:100%;padding:30px;box-shadow:0 14px 0 rgba(0,0,0,.35);animation:pop-in .35s;position:relative}
.oblogo{display:flex;align-items:center;gap:10px;font-family:'Unbounded';font-weight:800;letter-spacing:.08em;font-size:14px;margin-bottom:14px}
.dlg h2{font-family:'Unbounded';font-size:clamp(20px,3vw,26px);margin-bottom:8px;line-height:1.25}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.lcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:18px 16px;border:2px solid var(--ink);border-radius:16px;background:#fff;cursor:pointer;transition:.18s;box-shadow:0 5px 0 var(--ink);text-align:left}
.lcard:hover{transform:translateY(-4px) rotate(-1.2deg)}
.lcard.sel{background:var(--sun)}
.lcard .flag{font-size:34px}
.lcard b{font-size:15px}
.lcard small{color:var(--ink2);font-style:italic}
.obar{height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:14px 0 18px}
.obar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun2));transition:width .4s}
.topt{width:100%;margin-bottom:9px;padding:13px 16px;font-size:15px}
.tres{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.tend{text-align:center}
.tend .big{font-family:'Unbounded';font-size:52px;font-weight:800;color:var(--pine);margin:8px 0}
.stepdots{display:flex;gap:6px;justify-content:center;margin-top:20px}
.stepdots i{width:9px;height:9px;border-radius:50%;background:rgba(27,42,35,.18)}
.stepdots i.on{background:var(--pine)}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:12px 0}
.nameinput{width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;font-weight:600;background:#fff;outline:none;margin-top:8px}
.nameinput:focus{box-shadow:0 0 0 3px rgba(255,212,59,.6)}

/* ---------- мобилка ---------- */
.mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--pine);border-top:3px solid var(--ink);padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
.mbar button{background:none;border:0;color:#f3efe2;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 10px;border-radius:10px}
.mbar button svg{width:22px;height:22px}
.mbar button.active{background:rgba(255,255,255,.14);color:var(--sun)}
@media(max-width:920px){
  aside{display:none}
  .mbar{display:flex}
  .shell{padding-bottom:86px}
  .stats{grid-template-columns:1fr 1fr}
  .langs{grid-template-columns:1fr}
  .avgrid{grid-template-columns:repeat(6,1fr)}
  .opts{grid-template-columns:1fr}
  .hchip.xp{display:none}
}

function dailyCredit(){const today=todayStr();
  if(S.streak.last===today)return false;
  S.streak.cur = (S.streak.last===daysAgoStr(1)) ? S.streak.cur+1 : 1;
  S.streak.best=Math.max(S.streak.best,S.streak.cur);
  S.streak.last=today;
  if(!S.hist.includes(today))S.hist.push(today);
  S.hist=S.hist.slice(-60);
  const c=$('#streakchip');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
  return true}

/* ============================== ПОГРУЖЕНИЕ: РЕНДЕР ТЕКСТА ============================== */
function lessonConcepts(lesson){const seen={},arr=[];lesson.sent.forEach(s=>s.forEach(p=>{if(p.id&&!seen[p.id]){seen[p.id]=1;arr.push(p.id)}}));return arr}
function computeForeign(lesson){const ids=lessonConcepts(lesson),ls=learnedSet();
  const quota=Math.round(ids.length*L().imm/100);
  const foreign=new Set(ids.filter(i=>ls.has(i)));
  for(const id of ids){if(foreign.size>=quota)break;foreign.add(id)}
  return foreign}
function smartJoin(pieces){let out='';pieces.forEach((p,i)=>{if(i>0&&!/^[.,:;!?…—»)%]/.test(p.raw))out+=' ';out+=p.html});return out}
function renderSent(sent,foreign,interactive){
  const ls=learnedSet();
  const pieces=sent.map(p=>{
    if(typeof p==='string')return{html:`<span class="nat">${p}</span>`,raw:p};
    const w=W(p.id);
    if(foreign.has(p.id)){
      const known=ls.has(p.id),cls=known?'known':'new',txt=w[S.cur];
      const html=interactive?`<button class="tk ${cls}" data-id="${p.id}">${txt}</button>`:`<span class="tk ${cls}">${txt}</span>`;
      return{html,raw:txt}}
    const txt=p.ru||w.ru;return{html:`<span class="nat">${txt}</span>`,raw:txt}});
  return smartJoin(pieces)}
function renderText(lesson,interactive=true){const foreign=computeForeign(lesson);
  return lesson.sent.map(s=>`<p style="margin-bottom:.9em">${renderSent(s,foreign,interactive)}</p>`).join('')}

function nextLessonId(){for(const l of LESSONS)if(!L().done[l.id])return l.id;return null}

function viewLessons(){
  const l=L(),lg=LANGS[S.cur],nid=nextLessonId();
  const nl=LESSONS.find(x=>x.id===nid);
  let hero='';
  if(nl){const foreign=computeForeign(nl);
    hero=`<div class="hero card" style="--d:.02s">

  return `<div class="overline">постепенное погружение · ${lg.flag} ${lg.name}</div>

function closePopup(){$('#poproot').innerHTML='';popupId=null}
function learnWord(id){const l=L();if(!l.learned.includes(id))l.learned.push(id);save();
  document.querySelectorAll(`.tk.new[data-id="${id}"]`).forEach(el=>{el.className='tk known just';});
  updateNewChip();renderHeader();renderSide();checkAch();
  if(route==='dict')renderView();
  toast(`«${fw(id)}» добавлено в словарь +2 XP`);S.xp+=2;save()}
function forgetWord(id){const l=L();l.learned=l.learned.filter(x=>x!==id);save();closePopup();
  toast(`«${fw(id)}» убрано из словаря`);renderAll()}
function updateNewChip(){if(route!=='reader')return;const lesson=LESSONS.find(x=>x.id===curLesson);if(!lesson)return;
  const foreign=computeForeign(lesson),ls=learnedSet();
  const n=[...foreign].filter(id=>!ls.has(id)).length;

let TSK=null;
function optsRu(id){const c=W(id);const pool=shuffle(WORDS.filter(w=>w.id!==id&&w.ru!==c.ru)).slice(0,3).map(w=>w.ru);return shuffle([c.ru,...pool])}
function optsFw(id){const c=W(id);const seen=new Set([c[S.cur]]);const pool=[];
  for(const w of shuffle(WORDS)){if(pool.length===3)break;const v=w[S.cur];if(!seen.has(v)){seen.add(v);pool.push(v)}}
  return shuffle([c[S.cur],...pool])}

function runMCQ(ids,box,onDone){
  let answered=0,ok=0;
  box.innerHTML=ids.map((id,qi)=>{const opts=optsRu(id);
    return `<div class="mrow"><div class="qword">${fw(id)} <button class="iconbtn" data-act="speak-txt" data-txt="${fw(id)}" style="vertical-align:-4px">🔊</button></div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-q="${qi}" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div></div>`}).join('');
  box.addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const row=b.closest('.mrow');row.querySelectorAll('.opt').forEach(o=>o.disabled=true);
    const qid=ids[+b.dataset.q];
    if(b.dataset.o===W(qid).ru){b.classList.add('ok');ok++}
    else{b.classList.add('bad');row.querySelector(`.opt[data-o="${W(qid).ru.replace(/"/g,'&quot;')}"]`)?.classList.add('ok')}
    answered++;if(answered===ids.length)setTimeout(()=>onDone(ok,ids.length),700)})}

function runPairs(ids,box,onDone){
  let sel=null,matched=0,errors=0;const n=ids.length;
  const left=shuffle(ids),right=shuffle(ids);
  box.innerHTML=`<div class="pcols"><div>${left.map(id=>`<button class="pb" data-side="L" data-id="${id}" style="width:100%;margin-bottom:9px">${fw(id)}</button>`).join('')}</div>
  <div>${right.map(id=>`<button class="pb" data-side="R" data-id="${id}" style="width:100%;margin-bottom:9px">${W(id).ru}</button>`).join('')}</div></div>
  <div class="tprog" id="pprog">соединено: 0 / ${n}</div>`;
  box.addEventListener('click',e=>{
    const b=e.target.closest('.pb');if(!b||b.classList.contains('done'))return;
    if(sel===b){b.classList.remove('sel');sel=null;return}
    if(!sel){sel=b;b.classList.add('sel');return}
    if(sel.dataset.side===b.dataset.side){sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
    if(sel.dataset.id===b.dataset.id){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;matched++;
      $('#pprog').textContent=`соединено: ${matched} / ${n}`;
      if(matched===n)setTimeout(()=>onDone(Math.max(0,n-Math.max(0,errors-(0)))),500)}
    else{errors++;const a=sel;sel=null;a.classList.add('bad');b.classList.add('bad');
      setTimeout(()=>{a.classList.remove('bad','sel');b.classList.remove('bad')},450)}})}

function findFillItems(lesson,k){
  const items=[];
  const pool=lesson?[[lesson]]:[LESSONS];
  const src=pool[0];
  const cands=[];
  src.forEach(ls=>ls.sent.forEach((s,si)=>s.forEach(p=>{if(p.id)cands.push({ls,si,id:p.id})})));
  const used=new Set();
  for(const c of shuffle(cands)){if(items.length>=k)break;if(used.has(c.id))continue;used.add(c.id);items.push(c)}
  return items}
function runFill(items,box,onDone){
  let answered=0,ok=0;
  box.innerHTML=items.map((it,qi)=>{
    const sent=it.ls.sent[it.si];
    const pieces=sent.map(p=>{
      if(p.id===it.id)return{html:'<span class="blank">……</span>',raw:'___'};
      if(typeof p==='string')return{html:p,raw:p};
      return{html:learnedSet().has(p.id)?fw(p.id):(p.ru||W(p.id).ru),raw:'x'}});
    const opts=optsFw(it.id);
    return `<div class="mrow"><div class="fillin">${smartJoin(pieces)}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-q="${qi}" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div></div>`}).join('');
  box.addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const row=b.closest('.mrow');row.querySelectorAll('.opt').forEach(o=>o.disabled=true);
    const correct=fw(items[+b.dataset.q].id);
    if(b.dataset.o===correct){b.classList.add('ok');ok++}
    else{b.classList.add('bad');row.querySelector(`.opt[data-o="${correct.replace(/"/g,'&quot;')}"]`)?.classList.add('ok')}
    answered++;if(answered===items.length)setTimeout(()=>onDone(ok,items.length),700)})}

  $('#tbar').style.width=Math.round(OB.qi/OB.qs.length*100)+'%';
  $('#tqzone').innerHTML=`<div style="font-size:12px;font-family:'JetBrains Mono';color:var(--ink2);margin-bottom:6px">вопрос ${OB.qi+1} из ${OB.qs.length}</div>
    <div class="qword" style="font-size:23px">${q.word} <button class="iconbtn" data-act="speak-ob">🔊</button></div>
    <div style="display:grid;gap:9px;margin-top:8px">${q.opts.map(o=>`<button class="opt topt" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>`;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.word);u.lang=LANGS[OB.lang].speech;u.rate=.9;speechSynthesis.speak(u)}catch(e){}
  $('#tqzone').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    $('#tqzone').querySelectorAll('.opt').forEach(x=>x.disabled=true);
    if(b.dataset.o===WMAP[q.id].ru){b.classList.add('ok');OB.score++;OB.correct.push(q.id)}
    else{b.classList.add('bad');
      $('#tqzone').querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===WMAP[q.id].ru)x.classList.add('ok')})}
    setTimeout(()=>{OB.qi++;obShowQ()},650)}))}
function obResult(){
  const lv=lvlFromScore(OB.score);OB.imm=lv.imm;OB.lbl=lv.lbl;
  $('#tbar')&&($('#tbar').style.width='100%');
  $('#obdlg').innerHTML=`<div class="tend">
    <div class="overline">результат теста</div>
    <div class="big">${OB.score} / ${OB.qs.length}</div>
    <div class="tres" style="justify-content:center">
      <span class="chip sun" style="font-size:14px">уровень ≈ ${lv.lbl}</span>
      <span class="chip sea" style="font-size:14px">старт погружения: ${lv.imm}%</span>
      <span class="chip" style="font-size:14px">📗 выучено слов: ${OB.correct.length}</span>
    </div>
    <p class="sub" style="margin:14px auto">${OB.score<=3?'Начнём с малого: почти весь текст будет на русском, а иностранные слова будут появляться по одному.':'Отличная база! Сразу добавим в тексты побольше изучаемого языка.'}</p>
    <button class="btn sun big" data-act="ob-toprofile">Дальше →</button></div>${obDots(2)}`}
function obStep4(){
  $('#obdlg').innerHTML=`<h2>Почти готово! 🎒</h2>
    <p class="sub">Как тебя зовут и кто будет твоим напарником?</p>
    <input class="nameinput" id="obname" maxlength="20" placeholder="Твоё имя">
    <div class="avgrid" style="margin-top:14px">${AVATARS.map(a=>`<button class="av ${a===S.avatar?'cur':''}" data-act="ob-av" data-av="${a}">${a}</button>`).join('')}</div>
    <button class="btn sun big" style="width:100%;margin-top:10px" data-act="ob-finish">Начать погружение 🌊</button>${obDots(3)}`}
function obFinish(){
  const l=L();
  l.imm=OB.imm;l.testLvl=OB.lbl||(OB.qs.length?'':'не проходил');
  OB.correct.forEach(id=>{if(!l.learned.includes(id))l.learned.push(id)});
  S.xp+=OB.correct.length;
  S.onboarded=true;save();
  $('#modalroot').innerHTML='';confetti();
  toast(`Добро пожаловать${S.name?', '+S.name:''}! Погружение начинается 🌊`);
  renderLetters();renderAll()}
function runLevelTestOnly(){
  OB={lang:S.cur,qs:[],qi:0,score:0,correct:[],imm:L().imm,lbl:null,retake:true};
  $('#modalroot').innerHTML=`<div class="ovl"><div class="dlg" id="obdlg"></div></div>`;
  obStep2()}
// переопределяем результат для пересдачи
const _obResult=obResult;
obResult=function(){
  if(!OB.retake)return _obResult();
  const lv=lvlFromScore(OB.score);
  const l=L();l.imm=lv.imm;l.testLvl=lv.lbl;
  OB.correct.forEach(id=>{if(!l.learned.includes(id))l.learned.push(id)});
  if(OB.score===OB.qs.length)S.perfect=true;
  save();checkAch();
  $('#obdlg').innerHTML=`<div class="tend"><div class="overline">новый результат</div>
    <div class="big">${OB.score} / ${OB.qs.length}</div>
    <div class="tres" style="justify-content:center"><span class="chip sun">уровень ≈ ${lv.lbl}</span><span class="chip sea">глубина: ${lv.imm}%</span></div>
    <button class="btn sun big" style="margin-top:18px" data-act="closemodal">Отлично!</button></div>`;
  renderAll()};

/* ============================== ОБРАБОТЧИКИ ============================== */
document.addEventListener('click',e=>{
  const actEl=e.target.closest('[data-act]');
  // клик по слову в тексте
  const tk=e.target.closest('.tk[data-id]');
  if(tk&&tk.tagName==='BUTTON'){const r=tk.getBoundingClientRect();openPopup(tk.dataset.id,r);return}
  if(!actEl){if(!e.target.closest('#wcard'))closePopup();
    if(!e.target.closest('#langbtn')&&!e.target.closest('.hmenu'))document.querySelectorAll('.hmenu').forEach(m=>m.remove());
    return}
  const act=actEl.dataset.act;
  switch(act){
    case 'nav':route=actEl.dataset.route;renderAll();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'open-lesson':{
      const idx=LESSONS.findIndex(l=>l.id===actEl.dataset.id);
      if(idx>0&&!L().done[LESSONS[idx-1].id]&&!L().done[actEl.dataset.id]){toast('🔒 Сначала пройди предыдущий урок');return}
      curLesson=actEl.dataset.id;route='reader';renderAll();window.scrollTo({top:0});break}
    case 'start-tasks':startTasks(LESSONS.find(x=>x.id===curLesson));break;
    case 'retry-tasks':startTasks(LESSONS.find(x=>x.id===curLesson));break;
    case 'finish-tasks':finishTasks();break;
    case 'learn':if(popupId)learnWord(popupId);closePopup();break;
    case 'forget':forgetWord(actEl.dataset.id||popupId);break;
    case 'closepop':closePopup();break;
    case 'speak':if(popupId)speak(fw(popupId));break;
    case 'speak-txt':speak(actEl.dataset.txt);break;
    case 'speak-ob':{const q=OB.qs[OB.qi];if(q){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.word);u.lang=LANGS[OB.lang].speech;speechSynthesis.speak(u)}catch(e2){}}break}
    case 'game':startGame(actEl.dataset.game);break;
    case 'dcat':dictCat=actEl.dataset.cat||null;renderView();break;
    case 'avatar':S.avatar=actEl.dataset.av;save();renderAll();break;
    case 'ob-av':S.avatar=actEl.dataset.av;document.querySelectorAll('#obdlg .av').forEach(b=>b.classList.toggle('cur',b.dataset.av===S.avatar));break;
    case 'setlang':S.cur=actEl.dataset.lang;save();renderLetters();renderAll();toast(`Язык: ${LANGS[S.cur].flag} ${LANGS[S.cur].name}`);break;
    case 'retake':runLevelTestOnly();break;
    case 'reset':if(confirm('Точно сбросить весь прогресс? Это действие необратимо.')){localStorage.removeItem(KEY);location.reload()}break;
    case 'closemodal':$('#modalroot').innerHTML='';renderAll();break;
    case 'langmenu':{
      document.querySelectorAll('.hmenu').forEach(m=>m.remove());
      const m=document.createElement('div');m.className='hmenu';
      m.innerHTML=Object.keys(LANGS).map(k=>{
        const prog=S.langs[k]?(S.langs[k].learned.length+' слов'):'не начат';
        return `<button class="mi ${k===S.cur?'cur':''}" data-act="setlang" data-lang="${k}">${LANGS[k].flag} ${LANGS[k].name}<small>${prog}</small></button>`}).join('');
      $('#langbtn').appendChild(m);e.stopPropagation();break}
    case 'ob-lang':OB.lang=actEl.dataset.lang;obStep1();break;
    case 'ob-todtest':case 'ob-totest':OB.lang=OB.lang;S.cur=OB.lang;save();obStep2();break;
    case 'ob-skip':OB.score=0;OB.correct=[];const lv=lvlFromScore(0);OB.imm=lv.imm;OB.lbl=lv.lbl;obStep4();break;
    case 'ob-toprofile':obStep4();break;
    case 'ob-finish':{const n=$('#obname');if(n&&n.value.trim())S.name=n.value.trim();obFinish();break}
  }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopup();document.querySelectorAll('.hmenu').forEach(m=>m.remove())}});
document.addEventListener('scroll',()=>{closePopup()},true);
$('#immslider').addEventListener('input',e=>{
  const v=+e.target.value;$('#gaugenum').textContent=v;$('#gaugefill').style.width=v+'%';$('#gaugediver').style.left=v+'%'});
$('#immslider').addEventListener('change',e=>{
  L().imm=+e.target.value;save();checkAch();if(route==='reader'||route==='lessons')renderView();renderSide()});

/* ============================== СТАРТ ============================== */
renderLetters();
renderHeader();renderSide();
if(!S.onboarded){renderView();openOnboarding()}
else renderView();
</script>
</body>
</html>
